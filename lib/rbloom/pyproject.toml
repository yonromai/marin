[build-system]
requires = ["maturin>=1.0,<2.0"]
build-backend = "maturin"

[project]
name = "rbloom"
description = "Highly optimized Bloom filter that mimics the Python set API, written in Rust"
readme = "README.md"
requires-python = ">=3.7"
classifiers = [
    "Programming Language :: Rust",
    "Programming Language :: Python :: Implementation :: CPython",
    "Programming Language :: Python :: Implementation :: PyPy",
]
dynamic = ["version"]
license = "MIT"
license-files = ["LICEN[CS]E*"]

[project.urls]
"Source Code" = "https://github.com/KenanHanke/rbloom"
Homepage = "https://github.com/KenanHanke/rbloom"
Issues = "https://github.com/KenanHanke/rbloom/issues"

[tool.maturin]
sdist-include = ["LICENSE", "README.md"]
# Avoid linking libpython, making wheels portable
# See. https://pyo3.rs/main/building-and-distribution.html#building-python-extension-modules
features = ["pyo3/extension-module"]

[tool.uv]
# Force rebuild if changes
cache-keys = [
  { glob = "**/*.rs" },
  { file = "Cargo.toml" },
  { file = "Cargo.lock" },
  { file = "pyproject.toml" }
]
